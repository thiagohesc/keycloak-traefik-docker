services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    container_name: keycloak

    command:
      - start

    environment:
      # PostgreSQL
      KC_DB: postgres
      KC_DB_URL_HOST: ${KEYCLOAK_DB_HOST:?Defina KEYCLOAK_DB_HOST}
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defina KEYCLOAK_DB_PASSWORD}

      # Endereço público
      KC_HOSTNAME: https://${KEYCLOAK_DOMAIN:?Defina KEYCLOAK_DOMAIN}

      # HTTPS terminado no Traefik
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"

      # Reverse proxy
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: "172.19.0.0/16"

      # Administrador inicial
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD}

      # Health e métricas
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # Logs
      KC_LOG: console
      KC_LOG_LEVEL: info
      KC_LOG_CONSOLE_OUTPUT: json

    extra_hosts:
      - "${KEYCLOAK_DB_HOST:?Defina KEYCLOAK_DB_HOST}=${KEYCLOAK_DB_IP:?Defina KEYCLOAK_DB_IP}"

    networks:
      - proxy

    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NET:?Defina TRAEFIK_NET}

      traefik.http.routers.keycloak.rule: Host(`${KEYCLOAK_DOMAIN:?Defina KEYCLOAK_DOMAIN}`)
      traefik.http.routers.keycloak.entrypoints: websecure
      traefik.http.routers.keycloak.tls: "true"
      traefik.http.routers.keycloak.tls.certresolver: cloudflare
      traefik.http.routers.keycloak.service: keycloak

      traefik.http.services.keycloak.loadbalancer.server.port: "8080"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - '{ printf "HEAD /health/ready HTTP/1.0\r\n\r\n" >&0; grep "HTTP/1.0 200"; } 0<>/dev/tcp/127.0.0.1/9000'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

    mem_limit: 2g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - ./themes:/opt/keycloak/themes:ro

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NET:?Defina TRAEFIK_NET}
